name: Check
on:
  push:
    branches: [master, family-stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just check
      - run: nix flake check
      - run: nix build .#calamares-extensions
